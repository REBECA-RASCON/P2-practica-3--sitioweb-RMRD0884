<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="estilos.css">
</head>

<body>
  <!-- Encabezado con el nombre del sitio -->
  <header>
    <h1>Coppel</h1>
  </header>

  <!-- Formulario de registro -->
  <main>
    <form id="formRegistro" class="tarjeta" novalidate>
      <h2>Registra tu cuenta</h2>

      <div id="mensaje" class="mensaje" role="alert" hidden></div>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="clara@gmail.com" required>

      <label for="nombre">Nombre(s)</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="apellido">Apellido(s)</label>
      <input type="text" id="apellido" name="apellido" required>

      <label for="password">Establece una contrasena</label>
      <input type="password" id="password" name="password" minlength="8" required>
      <small>Minimo 8 caracteres.</small>

      <label for="password2">Repite la contrasena</label>
      <input type="password" id="password2" name="password2" required>

      <div class="botones">
        <button type="submit" class="btn">Crear cuenta</button>
        <button type="reset" class="btn btn-secundario">Limpiar</button>
      </div>

      <p class="enlaces">
        <a href="sesion.html">Ya tienes cuenta? Inicia sesion aqui</a><br>
        <a href="index.html">Regresar a la pagina principal</a>
      </p>
    </form>
  </main>

  <!-- Pie de pagina -->
  <footer>
    <p>REBECA MIRANDA RASCON DEVORA 5;J 0884</p>
  </footer>

  <!-- Codigo que envia el formulario a registrar.php -->
  <script>
    // Busca el formulario y la caja de mensajes
    const form = document.getElementById("formRegistro");
    const mensaje = document.getElementById("mensaje");

    // Muestra un mensaje en pantalla
    function mostrar(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = "mensaje " + tipo;
      mensaje.hidden = false;
    }

    // Cuando se presiona Crear cuenta
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      mensaje.hidden = true;

      // Revisa que no haya campos vacios
      if (!form.email.value.trim() || !form.nombre.value.trim() ||
          !form.apellido.value.trim() || !form.password.value) {
        mostrar("Llena todos los campos.", "error");
        return;
      }
      // Revisa el minimo de 8 caracteres
      if (form.password.value.length < 8) {
        mostrar("La contrasena debe tener al menos 8 caracteres.", "error");
        return;
      }
      // Las contrasenas deben coincidir
      if (form.password.value !== form.password2.value) {
        mostrar("Las contrasenas no coinciden.", "error");
        return;
      }

      try {
        // Envia los datos a registrar.php
        const resp = await fetch("registrar.php", {
          method: "POST",
          body: new FormData(form)
        });
        const datos = await resp.json();

        // Si se creo la cuenta, va a iniciar sesion
        if (datos.ok) {
          mostrar("Cuenta creada. Te llevamos a iniciar sesion...", "exito");
          setTimeout(() => { window.location.href = "sesion.html"; }, 1500);
        } else {
          mostrar(datos.mensaje, "error");
        }
      // Si no hay conexion con el servidor
      } catch (err) {
        mostrar("No se pudo conectar con el servidor. Revisa que PHP y MySQL esten encendidos.", "error");
      }
    });
  </script>
</body>
</html>
